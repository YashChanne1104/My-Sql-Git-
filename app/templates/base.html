<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SQL Deploy Gate{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="topbar">
        <a href="/ui/login" class="brand">
            <span class="gate-dot"></span> SQL DEPLOY GATE
        </a>
        <nav>
            {% if current_user %}
            <span style="color: var(--text-muted); font-size: 14px;">{{ current_user.email }}</span>
            <a href="/ui/logout">Log out</a>
            {% else %}
            <a href="/ui/login">Log in</a>
            {% endif %}
        </nav>
    </div>

    {% block content %}{% endblock %}
</body>

</html>
